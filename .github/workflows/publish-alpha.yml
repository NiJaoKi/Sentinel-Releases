name: Publish verified Windows Alpha
on:
  push:
    branches: [publish-alpha]
    paths: [.github/workflows/publish-alpha.yml, release-manifest.json]
permissions:
  contents: read
concurrency:
  group: publish-ui-0.4.1-alpha-2
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'NiJaoKi/Sentinel-Releases'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download only approved release assets
        env:
          GH_TOKEN: ${{ secrets.SOURCE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Add SOURCE_RELEASE_TOKEN with Contents: read access to NiJaoKi/Sentinel, then rerun this job.'
            exit 1
          fi
          mkdir assets
          gh release download v0.4.1-alpha.2 --repo NiJaoKi/Sentinel --dir assets
      - name: Verify exact asset list and approved hashes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          expected=json.loads(pathlib.Path('release-manifest.json').read_text())
          root=pathlib.Path('assets')
          assert {p.name for p in root.iterdir()}==set(expected), 'Unexpected asset list'
          for name,digest in expected.items():
              with (root/name).open('rb') as f:
                  actual=hashlib.file_digest(f,'sha256').hexdigest()
              assert actual==digest, f'Hash mismatch: {name}'
          info=json.loads((root/'BUILD-INFO.json').read_text())
          assert '39f0c1a173db32fc7d907849ba85e2d23719db04' in json.dumps(info), 'Unexpected source commit'
          print('Verified all seven approved assets.')
          PY
      - name: Publish and verify uploaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.4.1-alpha.2
          repo=NiJaoKi/Sentinel-Releases
          gh api "repos/$repo" --jq .visibility | grep -qx public
          gh api "repos/$repo/releases?per_page=100" > releases.json
          python3 - <<'PY'
          import json
          assert not any(r['tag_name']=='v0.4.1-alpha.2' for r in json.load(open('releases.json'))), 'Release already exists; refusing to overwrite it'
          PY
          gh release create "$tag" assets/* --repo "$repo" --target "$GITHUB_SHA" --draft --prerelease --title 'Sentinel 0.4.1 — Console & Installer Alpha 2' --notes-file RELEASE-NOTES.md
          mkdir verification
          gh release download "$tag" --repo "$repo" --dir verification
          python3 - <<'PY'
          import hashlib,json,pathlib
          expected=json.loads(pathlib.Path('release-manifest.json').read_text())
          root=pathlib.Path('verification')
          assert {p.name for p in root.iterdir()}==set(expected)
          for name,digest in expected.items():
              with (root/name).open('rb') as f:
                  assert hashlib.file_digest(f,'sha256').hexdigest()==digest, name
          PY
          gh release edit "$tag" --repo "$repo" --draft=false --prerelease --latest=false
      - name: Check download without authentication
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output anonymous.exe https://github.com/NiJaoKi/Sentinel-Releases/releases/download/v0.4.1-alpha.2/Sentinel-Setup-0.4.1-x64.exe
          python3 - <<'PY'
          import hashlib,json
          with open('anonymous.exe','rb') as f:
              assert hashlib.file_digest(f,'sha256').hexdigest()==json.load(open('release-manifest.json'))['Sentinel-Setup-0.4.1-x64.exe']
          print('Anonymous installer download hash verified.')
          PY
